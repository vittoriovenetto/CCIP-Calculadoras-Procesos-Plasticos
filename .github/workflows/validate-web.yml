name: Validate CCIP web
on:
  push:
    branches: ["feature/catalogo-90-i18n-formulas", "fix/ocultar-propiedades-no-documentadas", "feature/buscador-comparador-catalogo", "audit/materiales-minimo-3-propiedades", "feature/ux-lean-materiales-v1.5", "feature/auditoria-lean-10-capturas", "fix/selector-materiales-cache", "feature/historial-nombres-comparacion-limpiar", "feature/etapa-1-identidad-aprendizaje", "feature/etapa-2-historial-exportaciones", "feature/etapa-3-materiales-fluidez-reciclados", "feature/etapa-4-explorador-aportes", "feature/etapa-5-secado-acondicionamiento", "feature/etapa-6-catalogo-maquinarias", "feature/etapa-7-auditoria-publicacion"]
  pull_request:
    branches: ["feature/web-v1-modular", "feature/catalogo-90-i18n-formulas", "fix/ocultar-propiedades-no-documentadas", "audit/materiales-minimo-3-propiedades", "feature/ux-lean-materiales-v1.5", "feature/auditoria-lean-10-capturas", "fix/selector-materiales-cache", "feature/historial-nombres-comparacion-limpiar", "feature/etapa-1-identidad-aprendizaje", "feature/etapa-2-historial-exportaciones", "feature/etapa-3-materiales-fluidez-reciclados", "feature/etapa-4-explorador-aportes", "feature/etapa-5-secado-acondicionamiento", "feature/etapa-6-catalogo-maquinarias"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check JS and JSON unit tests
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Independent numerical and inventory audit
        run: |
          python scripts/validate-numerics-stage7.py
          node scripts/audit-machine-catalog.mjs --require-complete
          node scripts/audit-stage7.mjs
      - name: Browser smoke test
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts
        shell: bash
        run: |
          mkdir -p test-artifacts
          python tests/browser_smoke.py 2>&1 | tee test-artifacts/browser.log
      - name: Validate history operations and real XLSX/PDF files
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-2
        run: python tests/browser_stage2.py
      - name: Validate formulations, flow evidence and exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-3
        run: python tests/browser_stage3.py
      - name: Validate material explorer, contributions and real datasheet exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-4
        run: python tests/browser_stage4.py
      - name: Verify manufacturer equipment profiles and UI
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-6
        run: python tests/browser_stage6.py
      - name: Audit drying evidence, manual persistence and exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-5
        run: python tests/browser_stage5.py
      - name: Stage 7 responsive, independent references and security regression
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-7
        run: python tests/browser_stage7.py
      - name: Check built Pages assets against stale browser cache
        run: |
          npm run build:pages
          python tests/browser_pages_cache.py
      - name: Save browser screenshots and log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccip-v13-browser-${{ github.run_id }}
          path: test-artifacts
          retention-days: 30

  publish-verified-pages:
    name: Publish validated Stage 7 with immutable history
    needs: [unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/etapa-7-auditoria-publicacion'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: ccip-production-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the exact tested commit with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Node 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Configure Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate the exact distribution without deploying
        run: |
          npm run build:pages
          python tests/browser_pages_cache.py
          CCIP_STAGE7_DIST=1 python tests/browser_stage7.py
      - name: Verify Pages, CI, archives, integrity and reproducibility; produce GO evidence
        run: node scripts/release-stage7-actions.mjs preflight
      - name: Publish using the guarded existing publisher, never force push
        env:
          CCIP_RELEASE_GO_FILE: ${{ runner.temp }}/ccip-stage7-release-go.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run deploy:pages
      - name: Explicitly request a Pages build (Actions GITHUB_TOKEN pushes do not trigger it)
        run: node scripts/release-stage7-actions.mjs trigger-pages
      - name: Check deployed public HTTPS files and preserved version
        run: node scripts/release-stage7-actions.mjs verify-public
      - name: Verify the seven processes, histories, files and languages on public Pages
        env:
          CCIP_STAGE7_URL: https://vittoriovenetto.github.io/CCIP-Calculadoras-Procesos-Plasticos/
          CCIP_TEST_ARTIFACTS: ${{ runner.temp }}/ccip-stage7-public-browser
        run: python tests/browser_stage7.py
      - name: Upload the release gate and deployment evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccip-etapa7-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ccip-stage7-*
          if-no-files-found: warn
          retention-days: 60
