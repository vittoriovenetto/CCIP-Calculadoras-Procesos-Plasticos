name: Validate CCIP web
on:
  push:
    branches: ["feature/catalogo-90-i18n-formulas", "fix/ocultar-propiedades-no-documentadas", "feature/buscador-comparador-catalogo", "audit/materiales-minimo-3-propiedades", "feature/ux-lean-materiales-v1.5", "feature/auditoria-lean-10-capturas", "fix/selector-materiales-cache", "feature/historial-nombres-comparacion-limpiar", "feature/etapa-1-identidad-aprendizaje"]
  pull_request:
    branches: ["feature/web-v1-modular", "feature/catalogo-90-i18n-formulas", "fix/ocultar-propiedades-no-documentadas", "audit/materiales-minimo-3-propiedades", "feature/ux-lean-materiales-v1.5", "feature/auditoria-lean-10-capturas", "fix/selector-materiales-cache", "feature/historial-nombres-comparacion-limpiar"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check JS and JSON unit tests
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts
        shell: bash
        run: |
          mkdir -p test-artifacts
          python tests/browser_smoke.py 2>&1 | tee test-artifacts/browser.log
      - name: Check built Pages assets against stale browser cache
        run: |
          npm run build:pages
          python tests/browser_pages_cache.py
      - name: Save browser screenshots and log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccip-v13-browser-${{ github.run_id }}
          path: test-artifacts
          retention-days: 30
