name: Validate CCIP web
on:
  push:
    branches: ["feature/manual-visual-ccip-integracion"]
  pull_request:
    branches: ["feature/ux-bibliotecas-materiales-maquinaria"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check JS and JSON unit tests
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Independent numerical and inventory audit
        run: |
          python scripts/validate-numerics-stage7.py
          node scripts/audit-machine-catalog.mjs --require-complete
          node scripts/audit-stage7.mjs
      - name: Browser smoke test
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts
        shell: bash
        run: |
          mkdir -p test-artifacts
          python tests/browser_smoke.py 2>&1 | tee test-artifacts/browser.log
      - name: Validate 19-chapter manual inside CCIP and on mobile
        run: python tests/browser_manual.py
      - name: Validate history operations and real XLSX/PDF files
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-2
        run: python tests/browser_stage2.py
      - name: Validate formulations, flow evidence and exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-3
        run: python tests/browser_stage3.py
      - name: Validate material explorer, contributions and real datasheet exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-4
        run: python tests/browser_stage4.py
      - name: Verify manufacturer equipment profiles and UI
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-6
        run: python tests/browser_stage6.py
      - name: Verify compact case controls and automatic equipment selection
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/ux-controls
        run: python tests/browser_machine_explorer.py
      - name: Audit drying evidence, manual persistence and exports
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-5
        run: python tests/browser_stage5.py
      - name: Stage 7 responsive, independent references and security regression
        env:
          CCIP_TEST_ARTIFACTS: test-artifacts/etapa-7
        run: python tests/browser_stage7.py
      - name: Check built Pages assets against stale browser cache
        run: |
          npm run build:pages
          python tests/browser_pages_cache.py
      - name: Save browser screenshots and log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccip-v13-browser-${{ github.run_id }}
          path: test-artifacts
          retention-days: 30

  publish-verified-pages:
    name: Publicar CCIP + manual visual tras GO verificado
    needs: [unit, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/manual-visual-ccip-integracion'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: ccip-production-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact tested commit with full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Python and Playwright
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Chromium for artifact verification
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pin current gh-pages commit for preservation
        run: |
          echo "CCIP_RELEASE_BASE_SHA=$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build and test the exact distributable
        run: |
          npm run build:pages
          python tests/browser_pages_cache.py
          CCIP_STAGE7_DIST=1 python tests/browser_stage7.py
          python tests/browser_manual.py
      - name: Audit source CI, release artifact, public Pages baseline and historical archives
        run: node scripts/release-stage7-actions.mjs preflight
      - name: Publish from this commit only, with approved release evidence and no forced update
        env:
          CCIP_RELEASE_GO_FILE: ${{ runner.temp }}/ccip-stage7-release-go.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run deploy:pages
      - name: Trigger official Pages build after GITHUB_TOKEN push
        run: node scripts/release-stage7-actions.mjs trigger-pages
      - name: Verify live CCIP and all critical manual images over HTTPS
        run: node scripts/release-stage7-actions.mjs verify-public
      - name: Save reproducible release evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ccip-manual-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/ccip-stage7-*
          if-no-files-found: warn
          retention-days: 60
