name: Fast UI check — Stage 6
on:
  push:
    branches: ["feature/etapa-6-catalogo-maquinarias"]
permissions:
  contents: read
jobs:
  machine-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Chromium + tests
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Equipment UI / responsive regression
        run: python tests/browser_stage6.py
