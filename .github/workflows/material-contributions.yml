name: Validate material contributions (activation pending)
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing CCIP material Issue number'
        required: true
        type: string
      prepare_pr:
        description: 'Maintainer: prepare a draft proposal PR after validation'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: material-contribution-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate Issue as untrusted JSON data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/material-contributions/validate.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: material-validation
          path: material-validation.json
          retention-days: 30
  prepare-proposal-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_pr
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7.0.0
        with:
          name: material-validation
          path: validation
      - name: Revalidate and prepare data-only draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/material-contributions/prepare-pr.mjs
